name: Build and Package Power BI Visual

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ "created" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install pbiviz CLI
        run: npm install -g powerbi-visuals-tools

      - name: Run ESLint
        run: npm run lint

      - name: Build & Package .pbiviz
        run: npm run package

      - name: Upload .pbiviz artifact
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-d3-sunburst-visual
          path: dist/*.pbiviz

      - name: Attach .pbiviz to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pbiviz
